name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AUTH_MODE: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: docker compose up -d --build --wait
      - run: npm run test:compose
      - name: OpenCode and Claude Code mixed workflow (mock runtimes)
        run: npm run test:compose
        env:
          QUEUE_SMOKE_MIXED: '1'
      - name: Package user program (no server credentials)
        uses: actions/upload-artifact@v4
        with:
          name: mcp-queue-user
          path: |
            src/
            client-public/
            public/
            package.json
            package-lock.json
            tsconfig.json
            사용자-시작.cmd
            시작안내.txt
      - if: always()
        run: docker compose logs --tail 100 server
