name: mcp-queue
services:
  bootstrap:
    image: node:22-bookworm-slim
    working_dir: /workspace
    environment:
      QUEUE_SERVER_URL: ${QUEUE_SERVER_URL:-http://localhost:3000}
      QUEUE_UID: ${QUEUE_UID:-}
      QUEUE_GID: ${QUEUE_GID:-}
    user: "0:0"
    volumes:
      - ./:/workspace
    command: [node, scripts/bootstrap.mjs]
  setup:
    image: node:22-bookworm-slim
    profiles: [tools]
    working_dir: /workspace
    environment:
      QUEUE_SERVER_URL: ${QUEUE_SERVER_URL:-http://localhost:3000}
    user: "${QUEUE_UID:-0}:${QUEUE_GID:-0}"
    volumes:
      - ./:/workspace
    command: [node, scripts/setup.mjs]
  server:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      AUTH_FILE: /run/queue/auth.json
      DATABASE_PATH: /data/queue.sqlite
    volumes:
      - queue-data:/data
      - ./.local/server-auth:/run/queue:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  queue-data:
