name: mcp-queue
services:
  bootstrap:
    image: node:22-bookworm-slim
    working_dir: /workspace
    environment:
      AUTH_MODE: ${AUTH_MODE:-oidc}
      QUEUE_SERVER_URL: ${QUEUE_SERVER_URL:-}
      QUEUE_PUBLIC_PORT: ${PORT:-3000}
      QUEUE_BIND_ADDRESS: ${BIND_ADDRESS:-${QUEUE_LISTEN_ADDRESS:-127.0.0.1}}
      QUEUE_HOST_ADDRESS: ${QUEUE_HOST_ADDRESS:-${COMPUTERNAME:-}}
      QUEUE_UID: ${QUEUE_UID:-}
      QUEUE_GID: ${QUEUE_GID:-}
    user: "0:0"
    volumes:
      - ./:/workspace
    command: [node, scripts/bootstrap.mjs]
  setup:
    image: node:22-bookworm-slim
    profiles: [tools]
    working_dir: /workspace
    environment:
      QUEUE_SERVER_URL: ${QUEUE_SERVER_URL:-}
      QUEUE_PUBLIC_PORT: ${PORT:-3000}
      QUEUE_BIND_ADDRESS: ${BIND_ADDRESS:-${QUEUE_LISTEN_ADDRESS:-127.0.0.1}}
      QUEUE_HOST_ADDRESS: ${QUEUE_HOST_ADDRESS:-${COMPUTERNAME:-}}
    user: "${QUEUE_UID:-0}:${QUEUE_GID:-0}"
    volumes:
      - ./:/workspace
    command: [node, scripts/setup.mjs]
  server:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-${QUEUE_LISTEN_ADDRESS:-127.0.0.1}}:${PORT:-3000}:3000"
    environment:
      AUTH_FILE: /run/queue/auth.json
      DATABASE_PATH: /data/queue.sqlite
      QUEUE_IN_CONTAINER: '1'
      AUTH_MODE: ${AUTH_MODE:-oidc}
      QUEUE_SERVER_URL: ${QUEUE_SERVER_URL:-}
      QUEUE_BIND_ADDRESS: ${BIND_ADDRESS:-${QUEUE_LISTEN_ADDRESS:-127.0.0.1}}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_TOKEN_AUTH_METHOD: ${OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PROMPT: ${OIDC_PROMPT:-}
      OIDC_AUTO_LOGIN: ${OIDC_AUTO_LOGIN:-true}
      OIDC_ALLOW_HTTP_LOCALHOST: ${OIDC_ALLOW_HTTP_LOCALHOST:-false}
      OIDC_DEVICE_ID_CLAIM: ${OIDC_DEVICE_ID_CLAIM:-}
      OIDC_DEVICE_NAME_CLAIM: ${OIDC_DEVICE_NAME_CLAIM:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      DEVICE_KEY_TTL_DAYS: ${DEVICE_KEY_TTL_DAYS:-90}
      CLIENT_WINDOWS_DOWNLOAD_URL: ${CLIENT_WINDOWS_DOWNLOAD_URL:-}
    volumes:
      - queue-data:/data
      - ./.local/server-auth:/run/queue:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  queue-data:
